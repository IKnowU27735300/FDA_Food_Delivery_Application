version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fashion_vault_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tap_fashion_db
    ports:
      - "3307:3306"
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: fashion_vault_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tap_fashion_db
      DB_USER: root
      DB_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  mysql_data:
