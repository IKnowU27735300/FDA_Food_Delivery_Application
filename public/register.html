<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Fashion Vault</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">Fashion Vault</a>
    </nav>

    <div class="section-container" style="margin-top: 50px; max-width: 480px;">
        <div class="glass" style="padding: 40px 30px; border-radius: 20px;">
            <h1 style="font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; text-align: center;">Join the Vault</h1>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 25px; font-size: 14px;">Create your personal fashion profile</p>

            <form onsubmit="handleRegister(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Full Name</label>
                    <input type="text" id="name" required placeholder="Alex Turner" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Email Address</label>
                    <input type="email" id="email" required placeholder="alex@example.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff;">
                </div>
                <button type="submit" class="btn-premium" style="width: 100%; padding: 13px; border-radius: 8px; font-size: 15px;">
                    Create Account
                </button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary);">
                Already have an account? <a href="/login" style="color: var(--accent-color); text-decoration: underline;">Log in</a>
            </p>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const user = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                role: 'USER'
            };
            localStorage.setItem('fv_user', JSON.stringify(user));
            window.location.href = '/home';
        }
    </script>
</body>
</html>
