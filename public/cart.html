<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - Fashion Vault</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">Fashion Vault</a>
        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="/products">Shop</a></li>
            <li><a href="/products?category=1">Men</a></li>
            <li><a href="/products?category=2">Women</a></li>
            <li><a href="/products?category=4">Kids</a></li>
            <li><a href="/products?category=3">Accessories</a></li>
        </ul>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/cart" class="cart-icon-wrapper" aria-label="Shopping Cart">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="cart-badge" id="nav-cart-count" style="display: none;">0</span>
            </a>
        </div>
    </nav>

    <div class="section-container" style="margin-top: 50px; max-width: 1100px;">
        <h1 class="section-title">Shopping Cart</h1>

        <div id="cart-content" style="margin-top: 40px;">
            <!-- Injected by JS -->
        </div>
    </div>

    <footer style="margin-top: 100px; padding: 40px 5% 30px; border-top: 1px solid var(--border-color); background: rgba(10,11,13,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto;">
            <div>
                <h4 style="font-weight: 800; font-size: 18px; letter-spacing: 0.5px; margin-bottom: 10px; color: var(--accent-color);">Fashion Vault</h4>
                <p style="font-size: 13px; color: var(--text-muted); max-width: 300px;">Where premium style is stored.</p>
            </div>
            <div style="font-size: 13px; color: var(--text-muted);">&copy; 2026 Fashion Vault Store.</div>
        </div>
    </footer>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
            const container = document.getElementById('cart-content');
            const badge = document.getElementById('nav-cart-count');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (badge) {
                if (totalItems > 0) {
                    badge.textContent = totalItems;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="glass" style="padding: 60px; text-align: center; border-radius: 16px;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom: 20px;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <h2 style="margin-bottom: 10px; color: #fff;">Your cart is empty</h2>
                        <p style="color: var(--text-secondary); margin-bottom: 30px;">Looks like you haven't added anything to your cart yet.</p>
                        <a href="/products" class="btn-premium">Browse Collection</a>
                    </div>
                `;
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            container.innerHTML = `
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px; align-items: start;">
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        ${cart.map((item, index) => `
                            <div class="glass" style="display: flex; align-items: center; gap: 20px; padding: 20px; border-radius: 12px;">
                                <img src="/${item.image_url}?v=2" alt="${item.name}" style="width: 80px; height: 95px; object-fit: cover; border-radius: 8px;">
                                <div style="flex: 1;">
                                    <h3 style="font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 5px;">${item.name}</h3>
                                    <p style="font-size: 13px; color: var(--text-muted);">Size: <strong style="color: #fff;">${item.size}</strong></p>
                                    <p style="font-size: 15px; font-weight: 700; color: var(--accent-color); margin-top: 6px;">₹${Number(item.price).toFixed(2)}</p>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <button onclick="changeQty(${index}, -1)" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff; font-weight: 800; cursor: pointer;">-</button>
                                    <span style="font-weight: 700; min-width: 25px; text-align: center;">${item.quantity}</span>
                                    <button onclick="changeQty(${index}, 1)" style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff; font-weight: 800; cursor: pointer;">+</button>
                                </div>
                                <button onclick="removeItem(${index})" style="background: none; border: none; color: #f87171; cursor: pointer; padding: 8px;" title="Remove Item">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="glass" style="padding: 30px; border-radius: 16px; position: sticky; top: 100px;">
                        <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 20px; color: #fff;">Order Summary</h3>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-secondary); font-size: 14px;">
                            <span>Subtotal</span>
                            <span style="color: #fff; font-weight: 600;">₹${subtotal.toFixed(2)}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--text-secondary); font-size: 14px;">
                            <span>Shipping</span>
                            <span style="color: #4ade80; font-weight: 600;">FREE</span>
                        </div>
                        <div style="border-top: 1px solid var(--border-color); padding-top: 15px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin-bottom: 25px; color: #fff;">
                            <span>Total</span>
                            <span style="color: var(--accent-color);">₹${subtotal.toFixed(2)}</span>
                        </div>
                        <a href="/checkout" class="btn-premium" style="display: block; text-align: center; padding: 14px; border-radius: 8px;">
                            Proceed to Checkout
                        </a>
                    </div>
                </div>
            `;
        }

        function changeQty(index, delta) {
            const cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('fv_cart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('fv_cart', JSON.stringify(cart));
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
