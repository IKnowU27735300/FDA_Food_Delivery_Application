<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fashion Vault</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">Fashion Vault [Admin Portal]</a>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="/home" class="btn-premium btn-secondary" style="padding: 8px 16px;">View Store</a>
            <a href="#" onclick="localStorage.removeItem('fv_user'); location.href='/login';" style="color: #f87171; font-size: 13px;">Logout</a>
        </div>
    </nav>

    <div class="section-container" style="margin-top: 40px;">
        <h1 class="section-title">Catalog Inventory Management</h1>
        <p style="color: var(--text-secondary); text-align: center; margin-top: 10px;">Monitor stock quantities, prices, and product variants across all categories.</p>

        <div class="glass" style="margin-top: 30px; border-radius: 16px; overflow: hidden; padding: 20px;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                <thead>
                    <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted);">
                        <th style="padding: 12px;">ID</th>
                        <th style="padding: 12px;">Product</th>
                        <th style="padding: 12px;">Category</th>
                        <th style="padding: 12px;">Base Price</th>
                        <th style="padding: 12px;">Status</th>
                    </tr>
                </thead>
                <tbody id="admin-table">
                    <tr><td colspan="5" style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading catalog...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const categories = { 1: "Men's Apparel", 2: "Women's Apparel", 3: "Accessories", 4: "Kids' Section" };
        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                const tbody = document.getElementById('admin-table');
                tbody.innerHTML = products.map(p => `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 12px; color: var(--text-muted); font-weight: 700;">#${p.id}</td>
                        <td style="padding: 12px; display: flex; align-items: center; gap: 12px;">
                            <img src="/${p.image_url}?v=2" style="width: 40px; height: 48px; object-fit: cover; border-radius: 6px;">
                            <strong style="color: #fff;">${p.name}</strong>
                        </td>
                        <td style="padding: 12px; color: var(--text-secondary);">${categories[p.category_id] || 'General'}</td>
                        <td style="padding: 12px; font-weight: 700; color: var(--accent-color);">₹${Number(p.price).toFixed(2)}</td>
                        <td style="padding: 12px;">
                            <span style="display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(74, 222, 128, 0.15); color: #4ade80;">Active</span>
                        </td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
