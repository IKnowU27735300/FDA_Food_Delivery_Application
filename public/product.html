<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Fashion Vault</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">Fashion Vault</a>
        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="/products" class="active">Shop</a></li>
            <li><a href="/products?category=1">Men</a></li>
            <li><a href="/products?category=2">Women</a></li>
            <li><a href="/products?category=4">Kids</a></li>
            <li><a href="/products?category=3">Accessories</a></li>
        </ul>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/cart" class="cart-icon-wrapper" aria-label="Shopping Cart">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="cart-badge" id="nav-cart-count" style="display: none;">0</span>
            </a>
        </div>
    </nav>

    <div class="section-container" style="margin-top: 50px; max-width: 1000px;">
        <div id="product-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start;">
            <p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center;">Loading product details...</p>
        </div>
    </div>

    <footer style="margin-top: 100px; padding: 40px 5% 30px; border-top: 1px solid var(--border-color); background: rgba(10,11,13,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto;">
            <div>
                <h4 style="font-weight: 800; font-size: 18px; letter-spacing: 0.5px; margin-bottom: 10px; color: var(--accent-color);">Fashion Vault</h4>
                <p style="font-size: 13px; color: var(--text-muted); max-width: 300px;">Where premium style is stored.</p>
            </div>
            <div style="font-size: 13px; color: var(--text-muted);">&copy; 2026 Fashion Vault Store.</div>
        </div>
    </footer>

    <script>
        function updateCartBadge() {
            try {
                const cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
                const total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
                const badge = document.getElementById('nav-cart-count');
                if (badge) {
                    if (total > 0) {
                        badge.textContent = total;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch(e) {}
        }
        updateCartBadge();

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || '1';

        let currentProduct = null;
        let selectedVariant = null;

        fetch(`/api/products?id=${id}`)
            .then(res => res.json())
            .then(product => {
                if (!product || product.error) {
                    document.getElementById('product-container').innerHTML = '<p style="color: red; grid-column: 1/-1; text-align: center;">Product not found.</p>';
                    return;
                }
                currentProduct = product;
                const variants = product.variants || [{ size: 'One Size', price: product.price, stock: 20 }];
                selectedVariant = variants[0];

                const container = document.getElementById('product-container');
                container.innerHTML = `
                    <div class="glass" style="padding: 15px; border-radius: 16px;">
                        <img src="/${product.image_url}?v=2" alt="${product.name}" style="width: 100%; border-radius: 12px; display: block;">
                    </div>
                    <div>
                        <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-color); font-weight: 700;">Curated Item</span>
                        <h1 style="font-size: 32px; font-weight: 800; margin: 10px 0 15px; color: #ffffff;">${product.name}</h1>
                        <div style="font-size: 26px; font-weight: 800; color: var(--accent-color); margin-bottom: 25px;" id="product-price">
                            ₹${Number(selectedVariant.price).toFixed(2)}
                        </div>
                        <p style="color: var(--text-secondary); line-height: 1.7; margin-bottom: 30px; font-size: 15px;">${product.description}</p>
                        
                        <div style="margin-bottom: 25px;">
                            <label style="display: block; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: var(--text-muted);">Select Size</label>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;" id="size-options">
                                ${variants.map((v, i) => `
                                    <button type="button" class="btn-size ${i === 0 ? 'active' : ''}" onclick="selectSize(${i})" style="padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-color); background: ${i === 0 ? 'var(--accent-color)' : 'rgba(255,255,255,0.05)'}; color: ${i === 0 ? '#000' : '#fff'}; cursor: pointer; font-weight: 700;">
                                        ${v.size}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div style="display: flex; gap: 15px; margin-top: 30px;">
                            <input type="number" id="qty" value="1" min="1" max="10" style="width: 70px; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff; text-align: center; font-weight: 700;">
                            <button type="button" class="btn-premium" onclick="addToCart()" style="flex: 1; padding: 14px; font-size: 15px; border-radius: 8px;">
                                Add to Vault Cart
                            </button>
                        </div>
                        <div id="added-alert" style="display: none; margin-top: 15px; color: #4ade80; font-weight: 600; font-size: 14px;">
                            ✓ Added to cart! <a href="/cart" style="color: var(--accent-color); text-decoration: underline; margin-left: 10px;">Go to Cart</a>
                        </div>
                    </div>
                `;
            });

        function selectSize(index) {
            const variants = currentProduct.variants;
            selectedVariant = variants[index];
            document.getElementById('product-price').textContent = `₹${Number(selectedVariant.price).toFixed(2)}`;
            const buttons = document.querySelectorAll('#size-options button');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.style.background = 'var(--accent-color)';
                    btn.style.color = '#000';
                } else {
                    btn.style.background = 'rgba(255,255,255,0.05)';
                    btn.style.color = '#fff';
                }
            });
        }

        function addToCart() {
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
            const existingIndex = cart.findIndex(item => item.product_id === currentProduct.id && item.size === selectedVariant.size);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += qty;
            } else {
                cart.push({
                    product_id: currentProduct.id,
                    name: currentProduct.name,
                    price: selectedVariant.price,
                    size: selectedVariant.size,
                    image_url: currentProduct.image_url,
                    quantity: qty
                });
            }
            localStorage.setItem('fv_cart', JSON.stringify(cart));
            updateCartBadge();
            const alert = document.getElementById('added-alert');
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
