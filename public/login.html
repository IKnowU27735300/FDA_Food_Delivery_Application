<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fashion Vault</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="logo">Fashion Vault</a>
    </nav>

    <div class="section-container" style="margin-top: 60px; max-width: 450px;">
        <div class="glass" style="padding: 40px 30px; border-radius: 20px;">
            <h1 style="font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; text-align: center;">Welcome Back</h1>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 30px; font-size: 14px;">Sign in to your Fashion Vault account</p>

            <form onsubmit="handleLogin(event)">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">Email Address</label>
                    <input type="email" id="email" required placeholder="admin@fashionvault.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff;">
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #fff;">
                </div>
                <button type="submit" class="btn-premium" style="width: 100%; padding: 13px; border-radius: 8px; font-size: 15px;">
                    Sign In
                </button>
            </form>

            <p style="text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-secondary);">
                Demo Admin: <code style="color: var(--accent-color);">admin@fashionvault.com</code> / <code style="color: var(--accent-color);">admin123</code>
            </p>
            <p style="text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-secondary);">
                Don't have an account? <a href="/register" style="color: var(--accent-color); text-decoration: underline;">Sign up</a>
            </p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const user = {
                name: email.split('@')[0],
                email: email,
                role: email.includes('admin') ? 'ADMIN' : 'USER'
            };
            localStorage.setItem('fv_user', JSON.stringify(user));
            if (user.role === 'ADMIN') {
                window.location.href = '/admin';
            } else {
                window.location.href = '/home';
            }
        }
    </script>
</body>
</html>
